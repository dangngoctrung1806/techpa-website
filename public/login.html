<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Quản Trị TechPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', sans-serif;
      background: #090d16;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      border-top: 4px solid #f59e0b;
      text-align: center;
    }
    .login-logo {
      height: 48px;
      margin: 0 auto 16px;
      object-fit: contain;
    }
    .login-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 26px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #fbbf24, #b45309);
      transform: translateY(-1px);
    }
    .error-msg {
      margin-top: 14px;
      padding: 10px;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="/logo.png" alt="TechPA" class="login-logo">
    <h1 class="login-title">CỔNG QUẢN TRỊ TECHPA</h1>
    <p class="login-sub">Vui lòng đăng nhập bằng tài khoản được phân quyền</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Tài khoản</label>
        <input type="text" id="username" required autocomplete="username" placeholder="Nhập tên đăng nhập">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Đăng Nhập Quản Trị</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const err = document.getElementById('errorMsg');

      btn.disabled = true;
      btn.textContent = 'Đang xác thực...';
      err.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('techpa_admin_token', data.token);
          window.location.href = '/admin';
        } else {
          err.textContent = data.error || 'Tài khoản hoặc mật khẩu không chính xác';
          err.style.display = 'block';
        }
      } catch (e) {
        err.textContent = 'Lỗi kết nối máy chủ';
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Đăng Nhập Quản Trị';
      }
    });
  </script>
</body>
</html>
